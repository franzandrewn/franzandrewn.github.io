name: Deploy prototype to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Firebase web configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID
          };
          const missing = Object.entries(config).filter(([, value]) => !value).map(([key]) => key);
          if (missing.length) throw new Error(`Missing Firebase configuration variables: ${missing.join(", ")}`);
          fs.writeFileSync("firebase-config.js", `export const firebaseConfig = ${JSON.stringify(config, null, 2)};\n`);
          NODE

      - name: Assemble static Pages artifact
        run: |
          mkdir -p dist/ru dist/en
          for locale in ru en; do
            cp index.html app.js calculations.mjs firebase-client.mjs localization.mjs styles.css firebase-config.js "dist/$locale/"
          done
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./ru/">
            <script>window.location.replace("./ru/");</script>
          </head>
          <body><a href="./ru/">Перейти к русской версии</a></body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
